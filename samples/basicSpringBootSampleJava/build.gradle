plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.adswizz'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

Properties properties = new Properties()
def localProp = project.rootProject.file('local.properties')
if (localProp.exists()) {
    properties.load(localProp.newDataInputStream())
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
    mavenCentral()

    maven {
        url "https://raw.githubusercontent.com/adswizz/ad-sdk-jvm/main/releases"
        credentials(HttpHeaderCredentials) {
            name = "Authorization"
            value = properties['adswizzToken']
        }
        authentication {
            header(HttpHeaderAuthentication)
        }
    }
}

def sdkVersion = properties['sdkVersion'] ?: "0.4.0"
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation("com.adswizz:sdk-jvm:$sdkVersion")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
